<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>贪吃蛇</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: #1a1a2e;
      font-family: "Microsoft YaHei", sans-serif;
      color: #eee;
      user-select: none;
    }
    h1 { margin-bottom: 10px; letter-spacing: 4px; }
    .info {
      display: flex;
      gap: 30px;
      margin-bottom: 10px;
      font-size: 18px;
    }
    .info span { color: #f5c542; font-size: 20px; font-weight: bold; }
    canvas {
      background: #16213e;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.6);
      border: 2px solid #0f3460;
      border-radius: 4px;
    }
    .controls { margin-top: 15px; font-size: 14px; color: #aaa; }
    #restart {
      margin-top: 15px;
      padding: 10px 30px;
      font-size: 16px;
      border: none;
      border-radius: 4px;
      background: #e94560;
      color: #fff;
      cursor: pointer;
      display: none;
    }
    #restart:hover { background: #c73652; }
  </style>
</head>
<body>
  <h1>🐍 贪吃蛇</h1>
  <div class="info">
    <div>得分：<span id="score">0</span></div>
    <div>最高分：<span id="highScore">0</span></div>
  </div>
  <canvas id="game" width="400" height="400"></canvas>
  <p class="controls">使用 方向键 / WASD 控制方向，空格键暂停</p>
  <button id="restart">重新开始</button>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const highScoreEl = document.getElementById('highScore');
    const restartBtn = document.getElementById('restart');

    // 网格配置：20x20，每格 20px
    const GRID_SIZE = 20;
    const CELL_SIZE = canvas.width / GRID_SIZE;

    let snake, direction, nextDirection, food, score, highScore, gameOver, paused, gameLoop;

    // 读取本地存储的最高分
    highScore = parseInt(localStorage.getItem('snakeHighScore')) || 0;
    highScoreEl.textContent = highScore;

    function init() {
      snake = [
        { x: 10, y: 10 },
        { x: 9, y: 10 },
        { x: 8, y: 10 }
      ];
      direction = { x: 1, y: 0 };
      nextDirection = { x: 1, y: 0 };
      score = 0;
      scoreEl.textContent = score;
      gameOver = false;
      paused = false;
      restartBtn.style.display = 'none';
      spawnFood();
      clearInterval(gameLoop);
      gameLoop = setInterval(update, 120);
      draw();
    }

    // 随机生成食物（避开蛇身）
    function spawnFood() {
      do {
        food = {
          x: Math.floor(Math.random() * GRID_SIZE),
          y: Math.floor(Math.random() * GRID_SIZE)
        };
      } while (snake.some(seg => seg.x === food.x && seg.y === food.y));
    }

    function update() {
      if (gameOver || paused) return;

      direction = nextDirection;
      const head = { x: snake[0].x + direction.x, y: snake[0].y + direction.y };

      // 撞墙检测
      if (head.x < 0 || head.x >= GRID_SIZE || head.y < 0 || head.y >= GRID_SIZE) {
        return endGame();
      }
      // 撞自己检测
      if (snake.some(seg => seg.x === head.x && seg.y === head.y)) {
        return endGame();
      }

      snake.unshift(head);

      // 吃到食物
      if (head.x === food.x && head.y === food.y) {
        score++;
        scoreEl.textContent = score;
        if (score > highScore) {
          highScore = score;
          highScoreEl.textContent = highScore;
          localStorage.setItem('snakeHighScore', highScore);
        }
        spawnFood();
      } else {
        snake.pop(); // 没吃到则移除尾巴
      }

      draw();
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // 绘制食物
      ctx.fillStyle = '#e94560';
      ctx.beginPath();
      ctx.arc(
        food.x * CELL_SIZE + CELL_SIZE / 2,
        food.y * CELL_SIZE + CELL_SIZE / 2,
        CELL_SIZE / 2 - 2,
        0,
        Math.PI * 2
      );
      ctx.fill();

      // 绘制蛇
      snake.forEach((seg, i) => {
        ctx.fillStyle = i === 0 ? '#4cd137' : '#76e08a';
        ctx.fillRect(
          seg.x * CELL_SIZE + 1,
          seg.y * CELL_SIZE + 1,
          CELL_SIZE - 2,
          CELL_SIZE - 2
        );
      });

      if (gameOver) {
        ctx.fillStyle = 'rgba(0,0,0,0.6)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 30px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('游戏结束', canvas.width / 2, canvas.height / 2);
      } else if (paused) {
        ctx.fillStyle = 'rgba(0,0,0,0.6)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 30px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('已暂停', canvas.width / 2, canvas.height / 2);
      }
    }

    function endGame() {
      gameOver = true;
      clearInterval(gameLoop);
      restartBtn.style.display = 'inline-block';
      draw();
    }

    function changeDirection(key) {
      const map = {
        ArrowUp: { x: 0, y: -1 },
        ArrowDown: { x: 0, y: 1 },
        ArrowLeft: { x: -1, y: 0 },
        ArrowRight: { x: 1, y: 0 },
        w: { x: 0, y: -1 },
        s: { x: 0, y: 1 },
        a: { x: -1, y: 0 },
        d: { x: 1, y: 0 }
      };
      const dir = map[key];
      if (!dir) return;
      // 禁止直接反向
      if (dir.x === -direction.x && dir.y === -direction.y) return;
      nextDirection = dir;
    }

    document.addEventListener('keydown', (e) => {
      const key = e.key.length === 1 ? e.key.toLowerCase() : e.key;
      if (key === ' ') {
        e.preventDefault();
        if (!gameOver) {
          paused = !paused;
          draw();
        }
        return;
      }
      if (key === 'Enter' && gameOver) {
        init();
        return;
      }
      changeDirection(key);
      e.preventDefault();
    });

    restartBtn.addEventListener('click', init);

    init();
  </script>
</body>
</html>
